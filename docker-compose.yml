version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:../data/dogfood.db
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-prod}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      APP_PORT: 3000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
